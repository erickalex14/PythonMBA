services:
  db:
    image: postgres:15-alpine
    container_name: mba3-bi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: MBAPruebas
    ports:
      - "127.0.0.1:5432:5432"
    # Docker da 64MB de /dev/shm por defecto y Postgres usa memoria compartida
    # para los workers paralelos: al agregar sobre view_ventas_espejo_reporte
    # (varios meses de kardex) reventaba con "DiskFull: could not resize shared
    # memory segment", aunque el disco del servidor estuviera al 8%.
    shm_size: "1gb"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin esto el backend arranca antes de que Postgres acepte conexiones: el
    # create_all del startup falla, queda solo registrado en el log y la app
    # sigue viva pero sin tablas (los reportes revientan con UndefinedTable).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MBAPruebas"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: mba3-bi-redis
    restart: unless-stopped
    # Solo accesible desde la red interna del compose: no se publica al host para
    # no chocar con el Redis de otros stacks del servidor.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: mba3-bi-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./deploy/env/backend.env:/app/.env
    environment:
      ROOT_PATH: "/apimbav1"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXTAUTH_URL=https://novitec.com.ec/reportesmba/api/auth
    container_name: mba3-bi-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:3001"
    volumes:
      - ./deploy/env/frontend.env:/app/.env:ro
    environment:
      DATABASE_URL: "postgresql://postgres:123456@db:5432/MBAPruebas"
      BACKEND_API_URL: "http://backend:8000"
      NEXTAUTH_URL: "https://novitec.com.ec/reportesmba/api/auth"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  pgdata:
